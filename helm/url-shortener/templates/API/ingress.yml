apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "url-shortener.fullname" . }}-api-ingress
  namespace: {{ .Values.namespace }}
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: {{ .Values.ingress.clusterIssuer }}
spec:
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: {{ .Values.ingress.tlsSecret }}

  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /shorten
            pathType: Prefix
            backend:
              service:
                name: {{ include "url-shortener.fullname" . }}-api-service
                port:
                  number: {{ .Values.api.port }}

          - path: /stats
            pathType: Prefix
            backend:
              service:
                name: {{ include "url-shortener.fullname" . }}-api-service
                port:
                  number: {{ .Values.api.port }}

          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "url-shortener.fullname" . }}-api-service
                port:
                  number: {{ .Values.api.port }}
