apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "url-shortener.fullname" . }}-dashboard-ingress
  namespace: {{ .Values.namespace }}
  annotations:
    kubernetes.io/ingress.class: nginx
    {{- if .Values.ingress.clusterIssuer }}
    cert-manager.io/cluster-issuer: {{ .Values.ingress.clusterIssuer }}
    {{- end }}
spec:
  {{- if .Values.ingress.tlsSecret }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: {{ .Values.ingress.tlsSecret }}
  {{- end }}

  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /summary
            pathType: Prefix
            backend:
              service:
                name: {{ include "url-shortener.fullname" . }}-dashboard-service
                port:
                  number: {{ .Values.dashboard.port }}

          - path: /recent
            pathType: Prefix
            backend:
              service:
                name: {{ include "url-shortener.fullname" . }}-dashboard-service
                port:
                  number: {{ .Values.dashboard.port }}

          - path: /top
            pathType: Prefix
            backend:
              service:
                name: {{ include "url-shortener.fullname" . }}-dashboard-service
                port:
                  number: {{ .Values.dashboard.port }}

          - path: /url
            pathType: Prefix
            backend:
              service:
                name: {{ include "url-shortener.fullname" . }}-dashboard-service
                port:
                  number: {{ .Values.dashboard.port }}

          - path: /healthz
            pathType: Prefix
            backend:
              service:
                name: {{ include "url-shortener.fullname" . }}-dashboard-service
                port:
                  number: {{ .Values.dashboard.port }}