apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: url-shortener
  labels:
    app.kubernetes.io/name: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker
    spec:
      serviceAccountName: worker-sa
      containers:
        - name: worker
          image: 679930074435.dkr.ecr.eu-west-2.amazonaws.com/worker_image

          envFrom:
            - configMapRef:
                name: worker-config

          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: DATABASE_URL

            - name: SQS_URL
              valueFrom:
                configMapKeyRef:
                  name: worker-config
                  key: SQS_URL

            - name: SQS_DLQ_URL
              valueFrom:
                configMapKeyRef:
                  name: worker-config
                  key: SQS_DLQ_URL

          resources:
            requests:
              memory: "128Mi"
              cpu: "250m"
            limits:
              memory: "256Mi"
              cpu: "500m"
