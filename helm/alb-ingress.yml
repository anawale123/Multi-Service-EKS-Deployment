apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: alb-frontend
  namespace: ingress-nginx
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:eu-west-2:235654897837:certificate/cb7d0cd5-828b-41bb-a37e-e40c39c51b8e
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/wafv2-acl-arn: arn:aws:wafv2:eu-west-2:235654897837:regional/webacl/waf/fa637106-8efe-4bd6-b023-191ee106f0e7

spec:
  ingressClassName: alb

  rules:
    - host: url-shortener-aws.co.uk
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ingress-nginx-controller
                port:
                  number: 80