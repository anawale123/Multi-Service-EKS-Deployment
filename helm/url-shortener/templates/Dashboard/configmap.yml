apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "url-shortener.fullname" . }}-dashboard-config
  namespace: {{ .Values.namespace }}
data:
  APP_ENV: {{ .Values.dashboard.config.APP_ENV | quote }}
  DB_HOST: {{ .Values.dashboard.config.DB_HOST | quote }}
  DB_PORT: {{ .Values.dashboard.config.DB_PORT | quote }}
