apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: url-shortener-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "https://github.com/anawale123/multi-service-eks-deployment"
    targetRevision: HEAD
    path: helm/url-shortener
    helm:
      valueFiles:
        - values-prod.yml
  destination:
    server: https://kubernetes.default.svc
    namespace: url-shortener
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true