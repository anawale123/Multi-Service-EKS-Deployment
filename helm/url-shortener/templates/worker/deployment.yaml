apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "url-shortener.fullname" . }}-worker
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: worker
spec:
  replicas: {{ .Values.worker.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker
    spec:
      serviceAccountName: {{ include "url-shortener.fullname" . }}-worker-sa
      containers:
        - name: worker
          image: "{{ .Values.worker.image }}"

          envFrom:
            - configMapRef:
                name: {{ include "url-shortener.fullname" . }}-worker-config

          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.worker.secrets.db }}
                  key: DATABASE_URL

            - name: SQS_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "url-shortener.fullname" . }}-worker-config
                  key: SQS_URL

            - name: SQS_DLQ_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "url-shortener.fullname" . }}-worker-config
                  key: SQS_DLQ_URL

          resources:
            requests:
              memory: {{ .Values.worker.resources.requests.memory }}
              cpu: {{ .Values.worker.resources.requests.cpu }}
            limits:
              memory: {{ .Values.worker.resources.limits.memory }}
              cpu: {{ .Values.worker.resources.limits.cpu }}
